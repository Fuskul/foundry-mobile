name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v0.3.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build web app
        working-directory: app
        run: npm run build:web

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.3.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk foundry-mobile-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: foundry-mobile-apk
          path: foundry-mobile-debug.apk
          retention-days: 30

      - name: Package Foundry module
        run: |
          cd module
          zip -r ../fvtt-mobile-bridge.zip . -x '*.DS_Store'
          cd ..
          cp module/module.json module.json

      - uses: actions/upload-artifact@v4
        with:
          name: fvtt-mobile-bridge
          path: |
            fvtt-mobile-bridge.zip
            module.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            foundry-mobile-debug.apk
            fvtt-mobile-bridge.zip
            module.json
          generate_release_notes: true
